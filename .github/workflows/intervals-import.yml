# Import orario delle corse e del wellness da Intervals.icu.
# Vercel Hobby concede un solo cron al giorno: questo giro esterno chiama la
# stessa route con ?scope=import (senza ripubblicare il piano).
# Richiede il secret del repository CRON_SECRET, uguale alla variabile su Vercel.
name: Import Intervals.icu

on:
  schedule:
    # Ogni ora al minuto 7, dalle 05 alle 21 UTC (07–23 in Italia d'estate).
    - cron: "7 5-21 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Chiama il cron di import
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Secret CRON_SECRET assente: import saltato."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://zitto-and-corri.vercel.app/api/cron/intervals?scope=import")
          echo "HTTP $status"
          head -c 2000 response.json; echo
          test "$status" = "200"
